<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Solana Iceberg" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0D0D1A" />

    <!-- Space Grotesk is self-hosted (see the @font-face block in
         src/index.css). This replaced a Google Fonts <link rel="stylesheet">,
         which put a render-blocking third-party stylesheet on the FCP path
         behind two extra DNS+TLS handshakes — fonts.googleapis.com for the CSS
         and fonts.gstatic.com for the file itself.

         One preload covers every weight: Space Grotesk is a variable font with
         a single wght axis, so all five weights the old query asked for
         resolved to this same woff2 and the browser instanced it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-v22-latin.woff2"
      crossorigin
    />

    <!-- The surface texture is the Largest Contentful Paint element on every
         route: it is the biggest thing the iceberg paints, and the iceberg is
         behind the home, layer and term views alike.

         Without this hint it is undiscoverable until React has mounted and
         IcebergSVG has rendered the <image> that references it — the preload
         scanner never sees an href nested inside SVG. That put the request at
         ~1,600ms on Slow 4G + 4x CPU; declaring it here moves it to ~170ms and
         takes LCP from 1,892ms to 1,708ms on / (1,940 -> 1,712 on /t/:id),
         medians of 7 runs.

         Deliberately NO fetchpriority="high". It was measured: raising this
         above its default lifts it past the render-blocking stylesheet too,
         and first paint pays for it — FCP went 708ms -> 976ms for the same
         LCP gain. Early discovery is the whole win here; the priority bump is
         a net loss. Leave it off.

         If IcebergSVG ever stops rendering this file, drop this tag too — an
         unused preload is a wasted request and Chrome will warn about it. -->
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="/iceberg-surface.svg"
    />

    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!--OG:START-->
    <title>Solana Iceberg — Interactive Glossary of 1,059 Solana Terms</title>
    <meta name="description" content="Explore 1,059 Solana terms across 5 depth layers — from Surface basics to deep protocol internals. Available in English, Portuguese, and Spanish." />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Solana Iceberg" />
    <meta property="og:description" content="Explore 1,059 Solana terms across 5 depth layers — from Surface basics to deep protocol internals." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Solana Iceberg — interactive glossary with iceberg visualization" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Solana Iceberg" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solana Iceberg" />
    <meta name="twitter:description" content="Explore 1,059 Solana terms across 5 depth layers — from Surface basics to deep protocol internals." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Solana Iceberg — interactive glossary with iceberg visualization" />
    <!--OG:END-->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Solana Iceberg",
            "description": "Interactive glossary that visualizes 1,059 Solana terms as five iceberg depth layers.",
            "inLanguage": ["en", "pt-BR", "es"],
            "publisher": { "@id": "%VITE_SITE_URL%/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "Superteam Brazil",
            "url": "https://github.com/solanabr",
            "sameAs": ["https://github.com/solanabr"]
          },
          {
            "@type": "DefinedTermSet",
            "@id": "%VITE_SITE_URL%/#glossary",
            "name": "Solana Iceberg Glossary",
            "url": "%VITE_SITE_URL%/",
            "description": "1,059 Solana terms across 5 depth layers and 14 categories, in English, Portuguese, and Spanish.",
            "inLanguage": ["en", "pt-BR", "es"],
            "publisher": { "@id": "%VITE_SITE_URL%/#organization" }
          }
        ]
      }
    </script>
  </head>

  <body>
    <!-- /api/meta paints the real page content in here so it is on screen at
         FCP. It sits ABOVE #root and is removed by the app only once the view
         matching this URL has painted, so the content never blinks out. If the
         app never boots, this simply stays — readable beats blank. Empty in
         dev and on any route /api/meta does not rewrite, where it collapses to
         nothing and is removed on mount. -->
    <!-- Kept on ONE line, with id first: /api/meta finds this element by
         regex, and a formatter splitting the tag across lines would silently
         stop it matching — head tags would still inject while the body
         quietly did not. Styling lives in src/index.css (#ssr-shell). -->
    <!-- prettier-ignore -->
    <div id="ssr-shell"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
